entitlement_note: >-
  The three licensed products map one-to-one onto the three tags in the OpenAPI (Company Premium
  API, Competitor Premium API, Feed API), which is why a key can be valid and still return 403 on
  a product it is not licensed for. Owler does not document which products a given license
  includes, and the API returns no entitlement introspection endpoint.
seat_products_note: >-
  Owler Community (free), Owler Pro and Owler Max are the human seat tiers, marketed at
  corp.owler.com/owler-community and corp.owler.com/owler-pro with the price shown only inside the
  www.owler.com/checkout flow. They are recorded here as context, NOT as API plans — none of them
  grants API access, and no price is quoted because the checkout host returned 403 to every probe.
