finding: >-
  For a data-licensing API sold to engineering teams, the absence of any first-party or maintained
  third-party client means every integrator writes raw HTTP against six GET endpoints. That is
  survivable given how small the surface is, but it also means nothing in the ecosystem tracks the
  v1 -> v3 migration: the two most discoverable clients still describe the retired search
  endpoints.
