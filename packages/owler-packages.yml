checked: '2026-08-14'
summary: >-
  Owler publishes NO first-party client library in any language. Every registry was queried
  unauthenticated on 2026-08-14 and there is no Owler-authored SDK on npm, PyPI, RubyGems,
  crates.io, Maven Central, NuGet or pkg.go.dev, and no SDK, code sample or download link on the
  developer portal — developers.owler.com is a bare Swagger UI with nothing around it. No `SDKs`
  pointer is wired into apis.yml because official_count is 0. The three packages below are all
  third-party wrappers built by other vendors from Owler's own OpenAPI, and every one of them is
  stale, abandoned or built against the RETIRED v1 API on the dead api.owler.com host — which is a
  finding in its own right: there is no maintained client for the current v3 contract anywhere.
