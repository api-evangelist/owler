summary: >-
  Owler publishes NO API changelog. There is no release-notes page, no dated entries, no RSS feed
  and no version history anywhere on the developer portal or corp.owler.com. The portal is a bare
  Swagger UI with no surrounding pages, corp.owler.com/changelog returns 404, and the corp sitemap
  contains no releases, changelog or what's-new page. No `ChangeLog` pointer is wired into apis.yml
  because there is nothing to point at. The entries below are NOT a changelog — they are the only
  dated, verifiable version facts this pipeline could establish, recorded so the v1 -> v3 gap is at
  least documented somewhere.
