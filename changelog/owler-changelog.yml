  auth: user_key header
  host: https://api.owler.com (no longer completes a TLS handshake)
  status: retired without notice
  removed_capabilities:
  - Company search — basicCompanySearch, searchCompany and fuzzyCompanySearch let a caller find a
    company by name, ticker, PermID, address or phone. NOTHING in v3 replaces this; v3 can only
    look up a company by a domain or an Owler id the caller already holds.
  - Non-premium company and competitor endpoints (/v1/company/id, /v1/company/url,
    /v1/company/competitor/*).
  - The `user_key` authentication parameter, replaced by `x-api-key`.
  note: >-
    The single most consequential API change in Owler's history is undocumented. A consumer
    migrating from v1 gets no notice, no mapping table and no sunset date — the host simply stopped
    serving TLS.
