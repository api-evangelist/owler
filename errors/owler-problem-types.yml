- status: 403
  title: Authentication Failed
  spec_description: Authentication Failed
  applies_to: [getCompanyByWebsite, getCompanyById, getCompetitorsForWebsite, getCompetitorsForId,
    getFeedsByWebsite, getFeeds]
  note: >-
    Owler uses 403 where most APIs use 401 — there is no 401 anywhere in the contract. A missing,
    malformed, expired or entitlement-less x-api-key all surface as the same 403, so a client
    cannot distinguish "bad key" from "key not licensed for this product" from the status alone.
    Owler's Company Premium / Competitor Premium products are separately licensed, which makes
    that ambiguity operationally significant.
  remediation: Check the x-api-key header is present and correct; if it is, contact the Owler
    account team to confirm the key is entitled to the product being called. Never retry blind.
  body_schema: null
