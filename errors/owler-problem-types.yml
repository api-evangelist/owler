  title: Resource Not Found
  spec_description: Resource Not Found
  applies_to: [getCompanyByWebsite, getCompanyById, getCompetitorsForWebsite, getCompetitorsForId]
  note: >-
    Declared ONLY on the Company Premium and Competitor Premium lookups. The two Feed operations
    do not declare 404 — consistent with a batch/search endpoint that returns an empty feed[]
    array rather than a not-found for an unknown company.
  remediation: The domain or Owler company id is not in Owler's graph. Re-resolve the domain (try
    the apex vs www form) or look the company up by the other key.
  body_schema: null
