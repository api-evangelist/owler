summary: >-
  The Owler Enterprise API declares five error statuses across its six operations and gives each a
  single-word description with NO response body schema and NO media type. There is no error code
  registry, no problem+json, no documented field names and no remediation guidance published
  anywhere on developers.owler.com. What follows is everything the contract actually says — the
  status codes and their descriptions — plus honest notes on what a client cannot know. Nothing
  here is invented: no error body example is given because Owler publishes none.
error_body_shape: unknown
error_body_note: >-
  Every 4xx/5xx response object in the OpenAPI is a bare {description} with no `content`, so the
  bytes a client receives on failure are undefined by the contract. A machine client must treat
  the status code as the only reliable signal and parse the body defensively.
