summary: >-
  Derived from the 12 schemas in components.schemas and the $ref graph between them. The model has
  one hub — the company — reachable by two interchangeable keys (an Owler `company_id` integer and
  a `website` domain) and projected in three different shapes depending on which product returned
  it: companyPremium (the full 26-field record), CompanyBasicVO (the 7-field stub embedded in feed
  items) and CompetitorBasicVO (the same stub plus a competitive `score`). Every other entity hangs
  off the company: funding rounds, acquisitions, the CEO, the HQ address, the stock listing,
  investors, and news feed items.
entities:
- name: companyPremium
  role: 'root aggregate — the full company record'
  returned_by: [getCompanyByWebsite, getCompanyById]
  identifier: 'company_id (integer)'
  alternate_identifiers: [website, perm_id, alternative_websites]
  field_count: 26
  scalar_fields: [company_id, name, short_name, description, website, profile_url, logo_url,
    owler_generated_logo, company_type, employee_count, revenue, founded_date, perm_id,
    facebook_link, linkedin_link, twitter_link, youtube_link]
  array_fields: [industries, sic_code, portfolio_company_ids, alternative_websites]
  note: >-
    perm_id is a Refinitiv/LSEG PermID, which makes this record joinable to external financial
    reference data. portfolio_company_ids is a self-referencing array of company_ids — the
    investor-to-portfolio edge, expressed as bare ids with no embedded objects.
- name: CompanyBasicVO
  role: company stub
  returned_by: embedded on every FeedsVO item
  identifier: 'company_id (integer)'
  field_count: 7
  fields: [company_id, name, short_name, website, profile_url, logo_url, owler_generated_logo]
- name: CompetitorBasicVO
  role: company stub plus competitive strength
  returned_by: [getCompetitorsForWebsite, getCompetitorsForId]
  identifier: 'company_id (integer)'
  field_count: 7
  fields: [company_id, name, short_name, website, profile_url, logo_url, score]
  note: >-
    `score` (integer) is the crowdsourced competitive-strength signal and is the ONLY field in the
    whole model that does not also exist on the basic company stub. It is the product Owler
    actually sells — the competitive graph edge weight — and it exists nowhere else in the
    contract.
- name: Ceo
  role: person
  embedded_on: companyPremium.ceo
  fields: [first_name, last_name, image_url]
  note: The only person entity in the model. There is no contacts or people API in this contract.
- name: Address
  role: value object
  embedded_on: companyPremium.hq_address
  fields: [street1, street2, city, state, postal_code, country, phone]
- name: Stock
  role: value object
  embedded_on: companyPremium.stock
  fields: [exchange, ticker]
  note: Present only for publicly traded companies; the discriminator is company_type.
- name: Funding
  role: event
  embedded_on: companyPremium.funding[]
  fields: [date, type, amount, undisclosed, 'investor[]']
- name: Investor
  role: company reference
  embedded_on: Funding.investor[]
  fields: [company_id, name, website]
  note: >-
    company_id is typed as a STRING here and as an INTEGER on every other company-bearing schema.
    A client deserializing the funding graph must coerce.
- name: Acquisition
  role: event
  embedded_on: companyPremium.acquisition[]
  fields: [company_id, acquirer_company_id, name, website, date, amount, status, undisclosed]
  note: Carries both sides of the edge as ids, so the acquisition graph can be walked without a
    second lookup.
- name: FeedsVO
  role: news/event item
  returned_by: [getFeeds, getFeedsByWebsite]
  identifier: 'id (string)'
  fields: [id, title, description, category, feed_date, source_url, owler_feed_url,
    enclosure_image, publisher_name, publisher_logo, company]
  categories: [NEWS, PRESS, FUNDING, ACQUISITION, PEOPLE, BLOG, VIDEOS]
- name: feedresults
  role: response envelope
  fields: ['feed[] -> FeedsVO', pagination_id]
- name: competitors
  role: response envelope
  fields: ['competitor[] -> CompetitorBasicVO', pagination_id]
