summary: >-
  Owler ships NO MCP server. Searched the developer portal, corp.owler.com, npm (including the
  @modelcontextprotocol and @owler scopes), PyPI and the public MCP directories, and probed
  mcp.owler.com (does not resolve) and the /mcp path on every Owler host. Nothing exists. The tool
  list below is a CANDIDATE derived one-to-one from the six operations in the published OpenAPI —
  it is a design proposal for what an Owler MCP server would expose, not a server anyone can call.
  Owler's only shipped agent-adjacent surface is the 2023 ChatGPT plugin
  (https://corp.owler.com/blog/owler-launches-chatgpt-plugin-), announced against the OpenAI plugin
  system that has since been retired; no /.well-known/ai-plugin.json is served on any Owler host
  today.
