design_notes:
- Every tool is read-only and safe to retry; no destructive or write tool exists in this contract.
- The two Feed tools are the natural batch primitives (10 identifiers per call); the four company
  and competitor tools are strictly single-subject, so an agent enriching a list must fan out.
- A real server should surface the 429 back to the agent as a retryable condition, since Owler
  publishes no limit and no Retry-After (see rate-limits/owler-rate-limits.yml).
- The `format` parameter should be pinned to json and NOT exposed as a tool input — an agent has no
  reason to request xml, and the xml shape is undocumented.
