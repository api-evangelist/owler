generated: '2026-08-14'
method: probed
source: live HTTPS probes of every Owler host in apis.yml and the OpenAPI servers[] block
summary: >-
  Owler serves NO /.well-known/ discovery surface. Every RFC 8615 path was probed on all five
  Owler hosts on 2026-08-14 and not one returned a document. There is no security.txt, no OIDC
  or OAuth discovery (consistent with the API being api-key authenticated, not OAuth), no
  api-catalog, no ai-plugin.json and no A2A agent card. Three distinct negative shapes were
  observed and are recorded separately below because they mean different things: corp.owler.com
  (Squarespace) answers a clean 404; apiv2.owler.com is an AWS API Gateway that answers 403
  "Missing Authentication Token" to every unmatched route, so a 403 there is a route miss, not a
  gated document; developers.owler.com / developers-v3.owler.com are static S3 website buckets
  that answer 403 AccessDenied for any key that does not exist; www.owler.com sits behind Akamai
  and answered 403 to every request from this pipeline, including its own homepage, so its
  well-known surface is UNDETERMINED rather than proven absent.
documents_found: 0
pointer_emitted: false
pointer_note: >-
  No WellKnown or SecurityTxt pointer is wired into apis.yml. Nothing returned a 200 carrying a
  real document, and a pointer would assert that Owler serves a discovery surface it does not.
