  evidence: >-
    429 "Too Many Requests" is declared on all six operations in the published OpenAPI 3.0.1
    (getCompanyByWebsite, getCompanyById, getCompetitorsForWebsite, getCompetitorsForId,
    getFeedsByWebsite, getFeeds).
  note: >-
    Scope is inferred as per-key only because x-api-key is the sole credential in the contract;
    Owler does not state whether the counter is per key, per account or per endpoint.
structural_limits:
- limit: 10 identifiers per Feed request
  parameter: company_id (getFeeds) / domain (getFeedsByWebsite)
  source: OpenAPI parameter description "Maximum of 10 Company Ids" / "Maximum of 10 Company
    Websites"
  note: A hard request-shaping limit, published and enforceable client-side. Not a rate limit, but
    it is the ceiling that determines how many calls a bulk job costs.
- limit: 100 results per Feed page
  parameter: limit
  default: 10
  source: OpenAPI parameter description "Number of results to be displayed - 10 (by default, if not
    specified) to 100"
- limit: 1 company per request
  applies_to: [getCompanyByWebsite, getCompanyById, getCompetitorsForWebsite, getCompetitorsForId]
  source: path shape — no batch parameter exists on the Company Premium or Competitor Premium
    operations
  note: >-
    The practical throughput constraint. Enriching N companies is N requests against an
    undocumented allowance, which makes the missing limit number the single most consequential
    documentation gap for anyone sizing a bulk enrichment job.
client_guidance: >-
  Treat the limit as unknown and adaptive: exponential backoff with jitter on 429, a conservative
  self-imposed concurrency ceiling, and a persisted cursor so a batch can resume. Do not build a
  fixed-rate scheduler against an unpublished allowance, and confirm the contracted number with the
  Owler account team before sizing any bulk job.
