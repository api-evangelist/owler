summary: >-
  Owler enforces a rate limit and documents nothing about it. All six operations declare a 429 Too
  Many Requests response in the published OpenAPI, which is positive evidence that a limit exists
  and is returned to callers — but no number, no window, no scope, no header family and no
  Retry-After behavior is published on developers.owler.com, corp.owler.com, or anywhere else this
  pipeline could reach. The developer portal is a bare Swagger UI with no prose pages around it, so
  there is no rate-limit section to read. Any actual allowance is set per contract in the
  data-licensing agreement.
limit_count: 0
limit_count_note: >-
  Zero PUBLISHED limits, not zero limits. This is an honest zero: the 429 proves enforcement, the
  absence of documentation is the finding.
headers_documented: false
headers: []
headers_note: >-
  No X-RateLimit-*, RateLimit-* (RFC 9331 draft) or Retry-After header is documented, and none
  could be observed live — every unauthenticated request to https://apiv2.owler.com returns 403
  from AWS API Gateway before any rate-limit header would be attached. Header names must NOT be
  guessed from the fact that the API is fronted by API Gateway: an AWS usage plan returns a bare
  429 with no rate headers by default, so a client cannot assume the standard family is present.
