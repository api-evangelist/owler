apis:
- name: Owler Enterprise API
  description: 'Read-only REST API over Owler''s company graph. Three products in one
    OpenAPI 3.0.1 definition: Company Premium (complete firmographics, funding, acquisitions,
    stock and CEO data for a company looked up by domain or Owler company id), Competitor
    Premium (the crowdsourced competitor list for a company by domain or id), and Feed
    (Owler news and event items for a batch of company ids or domains). Every operation
    is a GET, authenticated with a per-account API key in the x-api-key request header,
    and served from https://apiv2.owler.com. Keys are issued through the Owler data-licensing
    sales process, not self-serve signup.'
