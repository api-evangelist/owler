name: Owler
description: 'Owler is a crowdsourced competitive- and business-intelligence platform
  that maintains real-time profiles on more than 20 million public and private companies,
  tracking firmographics, funding, and news across 45M+ competitive relationships
  contributed and validated by a community of 5M+ business professionals. It is delivered
  as web and mobile apps (Owler Community, Pro, and Max), a Chrome extension, and CRM
  and collaboration integrations (Salesforce, HubSpot, Slack, Microsoft Teams, ChatGPT).
  The Owler Enterprise API is a real, publicly documented REST API: a Swagger UI developer
  portal at developers.owler.com renders an OpenAPI 3.0.1 definition (six read operations
  across Company Premium, Competitor Premium and Feed, served from https://apiv2.owler.com,
  authenticated with an x-api-key header) that is fetchable at
  https://developers-v3.owler.com/apis/api3-swagger.json. Access to the data itself is
  sold through the data-licensing sales motion rather than self-serve signup, and Owler
  ships no first-party SDKs, CLI or MCP server. Owler was acquired by Meltwater in 2021.
  Added to the API Evangelist network from the Norwest Venture Partners portfolio.'
