name: Owler
description: 'Owler is a crowdsourced competitive- and business-intelligence platform
  that maintains real-time profiles on more than 20 million public and private companies,
  tracking firmographics, funding, and news across 45M+ competitive relationships
  contributed and validated by a community of 5M+ business professionals. It is delivered
  as web and mobile apps (Owler Community, Pro, and Max), a Chrome extension, and CRM
  and collaboration integrations (Salesforce, HubSpot, Slack, Microsoft Teams, ChatGPT).
  Its "Owler API" is an enterprise data-licensing offering — a competitive relationship
  graph, dynamic firmographics, and content monitoring — sold via sales contact rather
  than a self-serve public developer API; there is no public developer portal, OpenAPI,
  or SDK surface. Owler was acquired by Meltwater in 2021. Added to the API Evangelist
  network from the Norwest Venture Partners portfolio.'
